<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="ZYNBYTE — official links.">
  <meta property="og:title" content="ZYNBYTE">
  <meta property="og:description" content="Find ZYNBYTE across the web.">
  <meta property="og:url" content="https://zynbyte-tech.github.io/">
  <meta name="twitter:card" content="summary">
  <title>ZYNBYTE — Official Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="wrap">
    <header class="topline">
      <span class="top-mark">Z<span>/</span>B</span>
      <span class="top-note">INDEPENDENT DIGITAL PRESENCE</span>
      <span class="live"><i></i> ONLINE</span>
    </header>

    <section class="hero">
      <p class="eyebrow"><span></span> OFFICIAL CONNECTIONS</p>
      <h1>ZYNBYTE<span class="period">.</span></h1>
      <div class="under-title"><span></span><span class="under-label">SELECT A DESTINATION</span><span></span></div>
    </section>

    <nav class="link-stack" aria-label="Official links">
      <a class="link-card" href="https://t.me/zynbyteoff" target="_blank" rel="noopener noreferrer">
        <span class="index">01</span>
        <span class="link-main"><strong>TELEGRAM</strong><small>CHANNEL & COMMUNITY</small></span>
        <span class="link-symbol">↗</span>
        <span class="card-glint"></span>
      </a>
      <a class="link-card" href="https://x.com/zynbyte" target="_blank" rel="noopener noreferrer">
        <span class="index">02</span>
        <span class="link-main"><strong>X / TWITTER</strong><small>THOUGHTS & UPDATES</small></span>
        <span class="link-symbol">↗</span>
        <span class="card-glint"></span>
      </a>
      <a class="link-card" href="https://github.com/zynbyte-tech" target="_blank" rel="noopener noreferrer">
        <span class="index">03</span>
        <span class="link-main"><strong>GITHUB</strong><small>CODE & EXPERIMENTS</small></span>
        <span class="link-symbol">↗</span>
        <span class="card-glint"></span>
      </a>
    </nav>

    <footer><span>© <span id="year">2026</span> ZYNBYTE</span><span class="footer-center">IDEAS INTO CODE</span><span>EST. 2026</span></footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const cards = document.querySelectorAll(".link-card");
    cards.forEach(card => {
      card.addEventListener("pointermove", event => {
        const r = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${event.clientX - r.left}px`);
        card.style.setProperty("--my", `${event.clientY - r.top}px`);
      });
    });
  </script>
</body>
</html>
